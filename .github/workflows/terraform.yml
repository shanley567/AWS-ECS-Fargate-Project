name: CI Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:

  #################################################
  # Change Detection
  #
  # Determines which parts of the repository
  # have changed before running expensive jobs.
  #################################################

  changes:

    name: Detect Changed Files

    runs-on: ubuntu-24.04

    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      application: ${{ steps.filter.outputs.application }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            terraform:
              - 'terraform/**'

            application:
              - 'app/**'

  #################################################
  # Terraform Validation
  #
  # Runs only when Terraform code changes.
  #################################################

  terraform:

    name: Terraform Infrastructure Validation

    needs: changes

    if: needs.changes.outputs.terraform == 'true'

    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: terraform

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      #################################################
      # Terraform Installation
      #################################################

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      #################################################
      # Check Terraform Formatting
      #################################################

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      #################################################
      # Download and Configure Providers
      #################################################

      - name: Terraform Init
        run: terraform init

      #################################################
      # Validate Terraform Syntax
      #################################################

      - name: Terraform Validate
        run: terraform validate

      #################################################
      # TFLint
      #
      # Detects Terraform best practice issues,
      # provider-specific issues, and style problems.
      #################################################

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint

      #################################################
      # Checkov Security Scanning
      #
      # Detects Terraform security and compliance
      # issues before infrastructure is deployed.
      #################################################

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          soft_fail: true

  #################################################
  # Application Validation
  #
  # Runs only when application code changes.
  #################################################

  application:

    name: Application Code Testing

    needs: changes

    if: needs.changes.outputs.application == 'true'

    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: app

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      #################################################
      # Python Installation
      #################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      #################################################
      # Install Runtime Dependencies
      #################################################

      - name: Install Application Dependencies
        run: pip install -r requirements.txt

      #################################################
      # Install Testing Dependencies
      #################################################

      - name: Install Test Dependencies
        run: pip install -r requirements-dev.txt

      #################################################
      # Run Unit Tests
      #################################################

      - name: Run Pytest
        run: pytest -v

      #################################################
      # Verify Container Build
      #
      # Ensures changes do not break the
      # container image build process.
      #################################################

      - name: Build Docker Image
        run: docker build -t devops-ecs-demo .